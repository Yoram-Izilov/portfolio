# Sample server blocks for the HOST/edge nginx reverse proxy (your Linux server's conf.d).
# This replaces the previous `guac.* -> portfolio:5173` block. The portfolio container
# (see docker-compose.yml) must run as `portfolio` on the `nginx_nginx_network` network so
# `proxy_pass http://portfolio:80/` resolves by container name.

# Redirect apex -> www
server {
    listen 80;
    server_name yoram-izilov.com;
    return 301 http://www.yoram-izilov.com$request_uri;
}

# Portfolio - production build served by the container's nginx on :80
server {
    listen 80;
    server_name www.yoram-izilov.com;

    location / {
        proxy_pass http://portfolio:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
