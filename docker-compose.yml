# Runs the portfolio as the `portfolio` container on the same Docker network as the
# host nginx reverse proxy, so `proxy_pass http://portfolio:80/` resolves by name.
#
#   docker compose up -d          # build (if needed) + start
#   docker compose up -d --build  # force a rebuild
#   docker compose logs -f
#
# It also joins the monitoring stack's network so nginx can ship OpenTelemetry spans to
# `otel-collector`/`tempo`. Both networks are external — created by other repos:
#   - proxy      -> nginx_nginx_network   (host reverse proxy; public routing)
#   - monitoring -> monitoring_monitoring (observability; created by the monitoring stack)

services:
  portfolio:
    build: .
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - proxy
      - monitoring

networks:
  proxy:
    external: true
    name: nginx_nginx_network
  monitoring:
    external: true
    name: monitoring_monitoring
