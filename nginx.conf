# Structured access log consumed by Loki (via Promtail Docker SD) for the visitor
# dashboard. `escape=json` keeps the line valid JSON even with quotes/backslashes in
# headers. `path` uses $uri (not $request_uri) so query strings stay out of the logs.
# `trace_id` ties each request to its OpenTelemetry span in Tempo (Loki "TraceID"
# derived field links logs -> trace).
log_format json_analytics escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"scheme":"$scheme",'
        '"trace_id":"$otel_trace_id"'
    '}';

# Export one span per request to Tempo (via the otel-collector, matching the bot's
# pattern). Failures here are non-fatal to request serving. Service name "portfolio"
# is what shows up in Tempo search and the Grafana service map.
otel_exporter {
    endpoint otel-collector:4317;
}
otel_service_name portfolio;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The only peer that reaches this container is the host nginx reverse proxy on
    # nginx_nginx_network, which forwards the real client in X-Forwarded-For. Trust it
    # so $remote_addr becomes the real visitor IP (the uniqueness key for the dashboard).
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/access.log json_analytics;

    # Emit a trace span for every request and propagate context to upstreams.
    otel_trace on;
    otel_trace_context propagate;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # SvelteKit hashed, immutable build assets
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Fingerprinted fonts
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Live status for the hero badge - a curated JSON file written by the
    # status-exporter sidecar into the shared `status` volume. Not a metrics API:
    # only four curated fields, refreshed on an interval. Before the sidecar's first
    # write the file is absent, so fall back to 204 (the client then stays neutral).
    location = /status.json {
        root /srv/status;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =204;
    }

    # Prerendered pages, then fall back to the client router
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
